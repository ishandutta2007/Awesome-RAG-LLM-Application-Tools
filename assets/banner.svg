<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowLeft" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" />
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -1px;
    }
    .highlight {
      fill: url(#primaryGrad);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .grid-line {
      stroke: #1e293b;
      stroke-width: 1;
      opacity: 0.45;
    }
    .data-node {
      fill: #38bdf8;
      filter: url(#softGlow);
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Glow Blobs in Background -->
  <circle cx="240" cy="140" r="220" fill="url(#glowLeft)" filter="url(#blurFilter)">
    <animate attributeName="cx" values="240;290;240" dur="10s" repeatCount="indefinite" />
    <animate attributeName="cy" values="140;180;140" dur="10s" repeatCount="indefinite" />
  </circle>
  <circle cx="960" cy="240" r="240" fill="url(#glowRight)" filter="url(#blurFilter)">
    <animate attributeName="cx" values="960;910;960" dur="12s" repeatCount="indefinite" />
    <animate attributeName="cy" values="240;200;240" dur="12s" repeatCount="indefinite" />
  </circle>

  <!-- Background Isometric / Blueprint Grid Lines -->
  <g opacity="0.6">
    <line x1="80" y1="0" x2="80" y2="380" class="grid-line" />
    <line x1="200" y1="0" x2="200" y2="380" class="grid-line" />
    <line x1="320" y1="0" x2="320" y2="380" class="grid-line" />
    <line x1="440" y1="0" x2="440" y2="380" class="grid-line" />
    <line x1="560" y1="0" x2="560" y2="380" class="grid-line" />
    <line x1="680" y1="0" x2="680" y2="380" class="grid-line" />
    <line x1="800" y1="0" x2="800" y2="380" class="grid-line" />
    <line x1="920" y1="0" x2="920" y2="380" class="grid-line" />
    <line x1="1040" y1="0" x2="1040" y2="380" class="grid-line" />

    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="140" x2="1200" y2="140" class="grid-line" />
    <line x1="0" y1="220" x2="1200" y2="220" class="grid-line" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />
  </g>

  <!-- Dynamic Network Stream / Animated Flow Lines (Subtle Background Decor) -->
  <g opacity="0.5">
    <path d="M 850 80 Q 950 140 1080 100 T 1160 220" fill="none" stroke="url(#lineGrad)" stroke-width="2" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="5s" repeatCount="indefinite" />
    </path>
    <path d="M 120 280 Q 220 220 320 290 T 480 250" fill="none" stroke="url(#lineGrad)" stroke-width="2" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" from="0" to="100" dur="6s" repeatCount="indefinite" />
    </path>

    <!-- Animated Data Pulses along lines -->
    <circle r="4" fill="#38bdf8" filter="url(#softGlow)">
      <animateMotion path="M 850 80 Q 950 140 1080 100 T 1160 220" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle r="3.5" fill="#a855f7" filter="url(#softGlow)">
      <animateMotion path="M 120 280 Q 220 220 320 290 T 480 250" dur="5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Floating Orbit Node (Right Aesthetic Element) -->
  <g transform="translate(1030, 180)" opacity="0.85">
    <circle r="60" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
    </circle>
    <circle r="90" fill="none" stroke="#1e293b" stroke-width="1.5">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="30s" repeatCount="indefinite" />
    </circle>
    <circle cx="60" cy="0" r="5" fill="#38bdf8" filter="url(#softGlow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
    </circle>
    <circle cx="-90" cy="0" r="4.5" fill="#a855f7" filter="url(#softGlow)">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="30s" repeatCount="indefinite" />
    </circle>
    <circle r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" fill="#38bdf8">⚡</text>
  </g>

  <!-- Foreground Title and Branding (Kept Sharp, Unobscured & Focused) -->
  <g transform="translate(100, 115)">
    <!-- Small Category Pill -->
    <g transform="translate(0, -60)">
      <rect width="215" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.9" />
      <circle cx="14" cy="14" r="4" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="26" y="18" class="pill-text" fill="#a5b4fc" font-size="11" letter-spacing="0.5">THE PRODUCTION AI STACK</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="0" class="title">
      Awesome <tspan class="highlight">RAG &amp; LLM</tspan> Application Tools
    </text>

    <!-- Subtitle -->
    <text x="0" y="44" class="subtitle">
      Curated Visual Flow Builders, Production Scaffolding &amp; Agentic RAG Frameworks
    </text>

    <!-- Foreground Feature Pills -->
    <g transform="translate(0, 85)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="145" height="36" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.2" />
        <rect width="145" height="36" rx="8" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.4" />
        <text x="16" y="23" class="pill-text">⚡ Agentic RAG</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(160, 0)">
        <rect width="180" height="36" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.2" />
        <rect width="180" height="36" rx="8" fill="none" stroke="#818cf8" stroke-width="1.2" opacity="0.4" />
        <text x="16" y="23" class="pill-text">🧩 Visual Flow Builders</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(355, 0)">
        <rect width="210" height="36" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.2" />
        <rect width="210" height="36" rx="8" fill="none" stroke="#c084fc" stroke-width="1.2" opacity="0.4" />
        <text x="16" y="23" class="pill-text">🚀 Production Scaffolding</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(580, 0)">
        <rect width="190" height="36" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.2" />
        <rect width="190" height="36" rx="8" fill="none" stroke="#10b981" stroke-width="1.2" opacity="0.4" />
        <text x="16" y="23" class="pill-text">🛡️ Data Sovereignty &amp; Eval</text>
      </g>
    </g>
  </g>
</svg>
